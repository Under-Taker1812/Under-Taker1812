name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          # Isometric commit calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Top languages used across repos
          plugin_languages: yes

          # plugin_achievements disabled — errors reliably ("Unexpected error"),
          # known fragile plugin (GitHub has no official Achievements API).
          # See the Achievements badge in the bio section instead.

          # Notable contributions to other people's projects
          plugin_notable: yes
