name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          # Isometric commit calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Top languages used across repos
          plugin_languages: yes

          # GitHub Achievements (Pull Shark, Galaxy Brain...) rendered into the image
          plugin_achievements: yes
          plugin_achievements_display: compact

          # Notable contributions to other people's projects
          plugin_notable: yes
